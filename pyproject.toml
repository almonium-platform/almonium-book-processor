[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "almonium-book-processor"
version = "0.2.0"
description = "Admin, API, and processing service for Almonium ebooks"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Almonium" }]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "celery>=5.6,<6",
  "dj-database-url>=2.2,<3",
  "Django>=5.2,<5.3",
  "defusedxml>=0.7,<1",
  "djangorestframework>=3.16,<4",
  "drf-spectacular>=0.28,<1",
  "EbookLib>=0.19,<1",
  "gunicorn>=23,<24",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "whitenoise>=6.9,<7",
]

[project.optional-dependencies]
dev = [
  "pytest-django>=4.11,<5",
  "pytest>=8.2,<9",
  "ruff>=0.9,<1",
]
worker = [
  "openai>=2.8,<3",
  "sentence-transformers>=5.1,<6",
  "simplemma>=1.1,<2",
  "spacy>=3.8,<4",
  "wordfreq>=3.1,<4",
  # Pinned spaCy models, one per NLP_SPACY_MODELS entry. They are dependencies,
  # not an optional download: without a model spaCy loads a blank pipeline that
  # cannot lemmatize, and vocabulary analysis then describes invented words.
  "de_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/de_core_news_sm-3.8.0/de_core_news_sm-3.8.0-py3-none-any.whl",
  "en_core_web_sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
  "fr_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl",
  "uk_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/uk_core_news_sm-3.8.0/uk_core_news_sm-3.8.0-py3-none-any.whl",
]

[tool.hatch.build.targets.wheel]
packages = ["src/almonium_book_processor"]

[tool.pytest.ini_options]
addopts = "-q"
DJANGO_SETTINGS_MODULE = "almonium_book_processor.config.settings"
testpaths = ["tests"]

[tool.ruff]
include = ["src/**/*.py", "tests/**/*.py"]
extend-exclude = ["**/migrations/*.py"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
