{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Almonium Books{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'catalog/app.css' %}">
  <script src="{% static 'catalog/live.js' %}" defer></script>
  <script src="{% static 'catalog/costs.js' %}" defer></script>
  <script src="{% static 'catalog/reader.js' %}" defer></script>
  <script src="{% static 'catalog/difficulty.js' %}" defer></script>
  <script src="{% static 'catalog/notes.js' %}" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{% url 'catalog:dashboard' %}">Almonium Books</a>
    <nav>
      <a href="{% url 'catalog:dashboard' %}">Public catalogue</a>
      <a href="{% url 'catalog:private-imports' %}">User imports</a>
      <a href="{% url 'catalog:removed-books' %}">Removed books</a>
      <a href="{% url 'admin:index' %}" title="Advanced maintenance and configuration">Advanced admin</a>
      <span>{{ request.user.get_username }}</span>
    </nav>
  </header>
  <main class="shell">
    {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
