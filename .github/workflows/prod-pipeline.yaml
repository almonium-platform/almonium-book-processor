name: Deploy Books to Production

# Production normally follows staging from the staging pipeline. This is the manual path:
# re-deploy a known digest to roll back, or build the current `develop` head while
# PROD_FOLLOWS_STAGING is off.

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Optional immutable image digest to promote or re-deploy"
        required: false
        type: string

permissions:
  contents: write # the deploy moves main to the commit production runs
  packages: write

jobs:
  run-pipeline:
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment_name: prod
      source_branch: develop
      image_digest: ${{ inputs.image_digest }}
    secrets: inherit
