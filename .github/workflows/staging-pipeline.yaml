name: Deploy Books to Staging

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Optional immutable image digest to re-deploy"
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  run-pipeline:
    uses: ./.github/workflows/reusable-build-and-deploy.yaml
    with:
      environment_name: staging
      source_branch: master
      image_digest: ${{ inputs.image_digest }}
    secrets: inherit
