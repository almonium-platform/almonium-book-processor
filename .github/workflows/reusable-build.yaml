name: Reusable Books Image Build

on:
  workflow_call:
    inputs:
      commit_sha:
        required: true
        type: string
    outputs:
      image_digest:
        description: Immutable image digest
        value: ${{ jobs.build.outputs.image_digest }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image_digest: ${{ steps.build_image.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Verify checked-out commit
        env:
          EXPECTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT_SHA"

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify source and migrations
        run: |
          python -m pip install -e '.[dev]'
          ruff check src tests
          ruff format --check src tests
          pytest
          python manage.py makemigrations --check --dry-run
          python manage.py check

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive immutable dependency image tag
        id: dependency_image
        run: |
          dependency_hash=$(sha256sum pyproject.toml Dockerfile | sha256sum | cut -d ' ' -f 1)
          echo "ref=ghcr.io/almonium-platform/almonium-book-processor:deps-${dependency_hash}" >> "$GITHUB_OUTPUT"

      - name: Check for dependency image
        id: dependency_image_exists
        env:
          DEPENDENCY_IMAGE: ${{ steps.dependency_image.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$DEPENDENCY_IMAGE" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ARM64 dependency image
        if: steps.dependency_image_exists.outputs.exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          target: dependencies
          platforms: linux/arm64
          push: true
          tags: ${{ steps.dependency_image.outputs.ref }}
          cache-from: type=gha,scope=almonium-book-processor-dependencies
          cache-to: type=gha,mode=max,scope=almonium-book-processor-dependencies

      - name: Build and push ARM64 image
        id: build_image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/almonium-platform/almonium-book-processor:${{ inputs.commit_sha }}
          labels: org.opencontainers.image.revision=${{ inputs.commit_sha }}
          build-args: DEPENDENCIES_IMAGE=${{ steps.dependency_image.outputs.ref }}
          sbom: true
          provenance: mode=max

      - name: Record built image
        env:
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
        run: |
          echo "### Built Almonium Books image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
